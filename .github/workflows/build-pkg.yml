name: Build PKG

# psbrowser - fase 0 (hello de red + visor de texto). Genera el PKG con el toolchain OpenOrbis en Linux (Ubuntu),
# reutilizando el mismo esquema que ya funciono en el proyecto de Ren'Py para PS4.
#
# INTERRUPTORES (Run workflow):
#   toolchain_tag  Tag del release de OpenOrbis (latest = el ultimo). Fija una version si una nueva rompe algo.
#   strict_tls     true = rechazar certificados que la consola no valide (-DPSB_STRICT_TLS). Por defecto true (en la prueba 1 de la PS4
#                  todos los HTTPS dieron verifyErr=0, asi que la consola valida los certificados).
# El eboot ya se compilo y enlazo en local con OpenOrbis v0.5.4 (toolchain-llvm-18); el PKG lo genera este CI.

on:
  workflow_dispatch:
    inputs:
      toolchain_tag:
        description: 'Tag del release de OpenOrbis (latest = el ultimo)'
        type: string
        default: 'latest'
      strict_tls:
        description: 'TLS estricto (rechaza certificados no validos). Por defecto true: en la prueba 1 todos los HTTPS dieron verifyErr=0'
        type: boolean
        default: true
      js_engine:
        description: 'Incluir JavaScript (QuickJS-ng v0.18.0 + DOM + CSS lite). Si el build con JS falla, se reintenta solo sin motor (-DPSB_NO_JS) y queda registrado en logs/js_fallback.txt'
        type: boolean
        default: true
      probe_sdl:
        description: 'Sonda de SDL/GPU (v0.9.5): lista que backends de render trae el SDL del toolchain y si hay algo de GNM/GPU (solo escribe logs/sdl_probe.txt, no toca el PKG)'
        type: boolean
        default: true
      probe_js:
        description: 'Sonda de JavaScript: descarga QuickJS-ng y prueba a compilarlo con los flags de OpenOrbis (solo escribe logs/quickjs_probe.txt, no toca el PKG)'
        type: boolean
        default: true

concurrency:
  group: build-pkg
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  pkg:
    name: Toolchain + PKG
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Clonar el repo
        uses: actions/checkout@v4

      - name: Dependencias (clang, lld, make)
        run: |
          mkdir -p logs
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld make zip unzip
          { clang --version | head -1; ld.lld --version | head -1; } 2>&1 | tee logs/versions.txt

      # PkgTool.Core pide OpenSSL 1.1 y Ubuntu 24.04 solo trae la 3 (mismo apaño que en el proyecto de Ren'Py).
      - name: Instalar libssl1.1 (para PkgTool.Core)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          ok=0
          for u in \
            "http://archive.ubuntu.com/ubuntu/pool/main/o/openssl/libssl1.1_1.1.1f-1ubuntu2_amd64.deb" \
            "http://security.ubuntu.com/ubuntu/pool/main/o/openssl/libssl1.1_1.1.1f-1ubuntu2.24_amd64.deb"; do
            if wget -q "$u" -O libssl1.1.deb; then ok=1; echo "Descargado: $u"; break; fi
          done
          [ "$ok" = 1 ] || { echo "::error::No pude descargar libssl1.1"; exit 1; }
          sudo dpkg -i libssl1.1.deb
          echo "CLR_OPENSSL_VERSION_OVERRIDE=1.1" >> "$GITHUB_ENV"

      - name: Descargar el toolchain de OpenOrbis
        env:
          TAG: ${{ inputs.toolchain_tag }}
        run: |
          set -euo pipefail
          repo=OpenOrbis/OpenOrbis-PS4-Toolchain
          if [ "$TAG" = "latest" ]; then ep="repos/$repo/releases/latest"; else ep="repos/$repo/releases/tags/$TAG"; fi
          gh api "$ep" > logs/release.json
          tag=$(jq -r .tag_name logs/release.json)
          echo "Release: $tag"
          jq -r '.assets[] | "\(.name)\t\(.size)"' logs/release.json | tee logs/assets.txt
          asset=$(jq -r '[.assets[].name | select(test("linux";"i")) | select(test("\\.(tar\\.gz|tgz|zip)$";"i"))][0] // empty' logs/release.json)
          if [ -z "$asset" ]; then
            asset=$(jq -r '[.assets[].name | select(test("\\.(tar\\.gz|tgz|zip)$";"i")) | select(test("windows|macos|win|mac|installer";"i") | not)][0] // empty' logs/release.json)
          fi
          [ -n "$asset" ] || { echo "::error::No encontre un asset de toolchain valido. Mira logs/assets.txt"; exit 1; }
          echo "Asset elegido: $asset"
          gh release download "$tag" --repo "$repo" --pattern "$asset" --dir dl
          mkdir -p "$HOME/oo"
          case "$asset" in
            *.zip) unzip -q "dl/$asset" -d "$HOME/oo" ;;
            *)     tar -xf "dl/$asset" -C "$HOME/oo" ;;
          esac
          bl=$(find "$HOME/oo" -type d -path '*/bin/linux' | head -1)
          [ -n "$bl" ] || { echo "::error::No hay bin/linux dentro del asset"; exit 1; }
          root=$(dirname "$(dirname "$bl")")
          chmod +x "$root"/bin/linux/* || true
          echo "OO_PS4_TOOLCHAIN=$root" >> "$GITHUB_ENV"
          echo "Toolchain en: $root"

      - name: Compilar (EBOOT + PKG)
        env:
          STRICT: ${{ inputs.strict_tls }}
          JS_ENGINE: ${{ inputs.js_engine }}
        run: |
          set -euo pipefail
          # Copia de todo samples/ (el Makefile busca los fuentes en <PROJDIR>/ y los samples esperan _common al lado).
          copia="$RUNNER_TEMP/samples"
          rm -rf "$copia"; cp -r "$OO_PS4_TOOLCHAIN/samples" "$copia"
          proj=psbrowser
          work="$copia/$proj"
          mkdir -p "$work/$proj"
          cp "$copia/SDL2/Makefile" "$work/Makefile"
          cp -r "$copia/SDL2/sce_sys" "$work/sce_sys"
          cp -r "$copia/SDL2/sce_module" "$work/sce_module"
          rm -f "$work/sce_sys/param.sfo"
          # Icono propio del PKG (512x512); si falta, se queda el del sample.
          if [ -f "$GITHUB_WORKSPACE/assets/icon0.png" ]; then cp "$GITHUB_WORKSPACE/assets/icon0.png" "$work/sce_sys/icon0.png"; echo "icono propio copiado"; fi
          cp "$GITHUB_WORKSPACE"/app/*.cpp "$GITHUB_WORKSPACE"/app/*.h "$work/$proj/"
          # Clase Keyboard del sample 'keyboard' (keyboard.h/.cpp), para leer el teclado USB con libSceKeyboard.
          cp "$copia"/keyboard/keyboard/keyboard.* "$work/$proj/"
          cp -r "$GITHUB_WORKSPACE/third_party" "$work/third_party"   # canvas.h incluye ../third_party/
          # Identidad propia del PKG (CONTENT_ID = 36 caracteres), sin los .cpp de _common y con las libs de red del sistema.
          sed -i -E \
            -e 's/^TITLE +:=.*/TITLE       := PS Browser/' \
            -e 's/^TITLE_ID +:=.*/TITLE_ID    := PSBR00001/' \
            -e 's/^CONTENT_ID +:=.*/CONTENT_ID  := IV0000-PSBR00001_00-PSBROWSER0000000/' \
            -e 's/^COMMONFILES +:=.*/COMMONFILES :=/' \
            -e 's/^(LIBS +:=.*)$/\1 -lSceNet -lSceSsl -lSceHttp -lSceKeyboard -lSceAvPlayer -lSceAudioOut -lSceUserService/' \
            "$work/Makefile"
          # -O2: sin optimizacion el dibujo del lienzo (bucles por pixel) era ~5-10x mas lento (v0.4.1 compilaba sin -O).
          extra="-O2"
          if [ "$STRICT" = "true" ]; then extra="$extra -DPSB_STRICT_TLS"; fi
          cd "$work"
          cat Makefile > "$GITHUB_WORKSPACE/logs/makefile.txt"
          # --- JavaScript (v0.9.0): QuickJS-ng fijado a v0.18.0 (la version con la que se probo la capa jsx en el PC).
          # Se copian a psbrowser/ solo los .c/.h necesarios (el Makefile compila psbrowser/*.c) y el shim de malloc_np.h.
          js_ok=0
          if [ "$JS_ENGINE" = "true" ]; then
            if git clone -q --depth 1 --branch v0.18.0 https://github.com/quickjs-ng/quickjs "$RUNNER_TEMP/qjs" 2>>"$GITHUB_WORKSPACE/logs/js_clone.txt"; then
              for f in quickjs dtoa libregexp libunicode; do
                { echo '#define NDEBUG 1'; echo '#define __STDC_NO_ATOMICS__ 1'; cat "$RUNNER_TEMP/qjs/$f.c"; } > "$work/$proj/qjs_$f.c"
              done
              cp "$RUNNER_TEMP/qjs/"*.h "$work/$proj/"
              cp "$GITHUB_WORKSPACE/third_party/qjs_shim/malloc_np.h" "$GITHUB_WORKSPACE/third_party/qjs_shim/psb_qjs_shim.c" "$work/$proj/"
              js_ok=1
            else
              echo "no se pudo clonar quickjs-ng" >> "$GITHUB_WORKSPACE/logs/js_fallback.txt"
            fi
          fi
          if [ "$js_ok" = "1" ]; then flags="$extra -I$proj"; else flags="$extra -DPSB_NO_JS"; fi
          echo "EXTRAFLAGS='$flags'" | tee "$GITHUB_WORKSPACE/logs/flags.txt"
          set +e
          make EXTRAFLAGS="$flags" 2>&1 | tee "$GITHUB_WORKSPACE/logs/build.log"
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            # v0.9.7/v0.9.8: primero se reintenta con la conversion de video escalar (-DPSB_NO_SIMD) y sin el ajuste de red (-DPSB_NO_NETTUNE: sysctl y RecvTimeOut) por si el toolchain no los acepta
            echo "::warning::El build fallo: se reintenta sin SSE2 y sin ajuste de red (-DPSB_NO_SIMD -DPSB_NO_NETTUNE). Mira logs/build_simd_failed.log"
            cp "$GITHUB_WORKSPACE/logs/build.log" "$GITHUB_WORKSPACE/logs/build_simd_failed.log"
            echo "el build con SSE2/ajuste de red fallo (rc=$rc); si el PKG se genero es con la conversion de video escalar y SIN sysctl/RecvTimeOut (mira build_simd_failed.log para saber cual fallo)" > "$GITHUB_WORKSPACE/logs/simd_fallback.txt"
            rm -rf "$work/$proj/x64"
            extra="$extra -DPSB_NO_SIMD -DPSB_NO_NETTUNE"
            if [ "$js_ok" = "1" ]; then flags="$extra -I$proj"; else flags="$extra -DPSB_NO_JS"; fi
            echo "EXTRAFLAGS='$flags'" | tee "$GITHUB_WORKSPACE/logs/flags.txt"
            make EXTRAFLAGS="$flags" 2>&1 | tee "$GITHUB_WORKSPACE/logs/build.log"
            rc=${PIPESTATUS[0]}
            if [ "$rc" -eq 0 ]; then echo "::warning::PKG generado SIN SSE2 (mira logs/build_simd_failed.log)"; else rm -f "$GITHUB_WORKSPACE/logs/simd_fallback.txt"; fi
          fi
          if [ "$rc" -ne 0 ] && [ "$js_ok" = "1" ]; then
            # v0.9.5: primero se reintenta CON JavaScript pero SIN Canvas 2D (el enlace del canvas con QuickJS es lo nuevo y mas facil de romper)
            echo "::warning::El build fallo: se reintenta con JavaScript pero SIN Canvas 2D (-DPSB_NO_CANVAS). Mira logs/build_canvas_failed.log"
            cp "$GITHUB_WORKSPACE/logs/build.log" "$GITHUB_WORKSPACE/logs/build_canvas_failed.log"
            echo "el build con Canvas 2D fallo (rc=$rc); si el PKG se genero es con JavaScript pero SIN Canvas 2D (getContext devuelve null)" > "$GITHUB_WORKSPACE/logs/canvas_fallback.txt"
            rm -rf "$work/$proj/x64"
            flags="$extra -I$proj -DPSB_NO_CANVAS"
            echo "EXTRAFLAGS='$flags'" | tee "$GITHUB_WORKSPACE/logs/flags.txt"
            make EXTRAFLAGS="$flags" 2>&1 | tee "$GITHUB_WORKSPACE/logs/build.log"
            rc=${PIPESTATUS[0]}
            if [ "$rc" -eq 0 ]; then echo "::warning::PKG generado SIN Canvas 2D (mira logs/build_canvas_failed.log)"; else cp "$GITHUB_WORKSPACE/logs/build.log" "$GITHUB_WORKSPACE/logs/build_nocanvas_failed.log"; fi
          fi
          if [ "$rc" -ne 0 ] && [ "$js_ok" = "1" ]; then
            echo "::warning::El build con JavaScript fallo: se reintenta sin motor (-DPSB_NO_JS). Mira logs/build_js_failed.log"
            cp "$GITHUB_WORKSPACE/logs/build.log" "$GITHUB_WORKSPACE/logs/build_js_failed.log"
            echo "build con QuickJS fallo (rc=$rc); PKG generado sin JavaScript (solo DOM + CSS lite)" > "$GITHUB_WORKSPACE/logs/js_fallback.txt"
            rm -f "$work/$proj"/qjs_*.c "$work/$proj"/psb_qjs_shim.c "$work/$proj/malloc_np.h"
            rm -rf "$work/$proj/x64"
            flags="$extra -DPSB_NO_JS"
            echo "EXTRAFLAGS='$flags'" | tee "$GITHUB_WORKSPACE/logs/flags.txt"
            make EXTRAFLAGS="$flags" 2>&1 | tee "$GITHUB_WORKSPACE/logs/build.log"
            rc=${PIPESTATUS[0]}
          fi
          set -e
          mkdir -p "$GITHUB_WORKSPACE/dist"
          find . -name '*.pkg' -exec cp {} "$GITHUB_WORKSPACE/dist/" \;
          find . -iname 'eboot.bin' -exec cp {} "$GITHUB_WORKSPACE/dist/" \; || true
          [ "$rc" -eq 0 ] || { echo "::error::make fallo ($rc). Mira logs/build.log"; exit "$rc"; }

      - name: Verificar el PKG (hash)
        run: |
          set -euo pipefail
          cd dist
          pkg=$(ls *.pkg 2>/dev/null | head -1 || true)
          [ -n "$pkg" ] || { echo "::error::No se genero ningun .pkg"; exit 1; }
          sha256sum "$pkg" > "$pkg.sha256"
          sha256sum -c "$pkg.sha256"
          { echo '### PKG'; echo '```'; ls -l --block-size=K *.pkg; cat "$pkg.sha256"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Inventario del toolchain (para decidir el soporte de video y otras APIs)
        if: always()
        run: |
          mkdir -p logs
          tc="${OO_PS4_TOOLCHAIN:-}"
          {
            echo "toolchain: $tc"
            echo "== lib (AvPlayer, video, audio, IME, imagen, fuentes, zlib)"
            ls "$tc/lib" 2>/dev/null | grep -i -E "avplayer|video|vdec|audio|ime|jpeg|png|webp|zlib|font|png|gif" || echo "(ninguna coincidencia)"
            echo "== cabeceras"
            find "$tc/include" \( -iname '*avplayer*' -o -iname '*videodec*' -o -iname '*ime*' -o -iname '*audioout*' -o -iname '*vdec*' \) 2>/dev/null | head -50
            echo "== Http.h: metodos y firmas usadas"
            grep -n "ORBIS_METHOD_\|sceHttpSendRequest\|sceHttpCreateRequestWithURL" "$tc/include/orbis/Http.h" 2>/dev/null | head -20
            echo "== samples"
            ls "$tc/samples" 2>/dev/null
          } > logs/toolchain_inventory.txt 2>&1 || true

      # v0.9.5: que SDL/GPU ofrece el toolchain (no cambia el PKG). Responde a: ¿hay renderer acelerado? ¿hay algo de GNM?
      - name: Sonda de SDL y GPU
        if: ${{ always() && inputs.probe_sdl }}
        continue-on-error: true
        run: |
          set +e
          out="$GITHUB_WORKSPACE/logs/sdl_probe.txt"
          mkdir -p "$GITHUB_WORKSPACE/logs"; : > "$out"
          tc="${OO_PS4_TOOLCHAIN:-}"
          {
            echo "toolchain: $tc"
            echo "== version de SDL"
            grep -n -E "define SDL_(MAJOR|MINOR)_VERSION|define SDL_PATCHLEVEL" "$tc/include/SDL2/SDL_version.h" 2>/dev/null
            echo "== lib: SDL, GNM, GPU, GL"
            ls "$tc/lib" 2>/dev/null | grep -i -E "sdl|gnm|gpu|gl|egl|videoout|vdec" || echo "(ninguna)"
            echo "== include: SDL, GNM, GPU, GL"
            find "$tc/include" \( -iname '*gnm*' -o -iname '*gpu*' -o -iname '*videoout*' -o -iname 'SDL_opengl*' -o -iname 'SDL_render.h' \) 2>/dev/null | head -40
            echo "== samples"
            ls "$tc/samples" 2>/dev/null
            for f in "$tc"/lib/libSDL2*.a "$tc"/lib/libSDL2*.so; do
              [ -f "$f" ] || continue
              echo "== simbolos/cadenas relevantes en $f"
              grep -a -o -i -E "[a-z_0-9]*(sw_renderer|SW_RenderDriver|GL_RenderDriver|GLES2_RenderDriver|renderer_gnm|gnm|videoout|PS4_|ORBIS_)[a-z_0-9]*" "$f" | sort | uniq -c | sort -rn | head -60
              echo "-- nombres de controladores de render"
              grep -a -o -E "(opengles2|opengles|opengl|software|direct3d|metal|vulkan|gnm|orbis|ps4)" "$f" | sort | uniq -c
            done
          } >> "$out" 2>&1
          cat "$out"

      # v0.9.6: el sondeo anterior encontro libScePigletv2VSH.so (EGL/OpenGL ES del sistema), libSceGnmDriver.so y una muestra 'piglet'.
      # Esta sonda vuelca esa muestra y las cabeceras relacionadas para escribir (v0.9.7) un renderer GLES2 experimental.
      - name: Sonda de Piglet (GLES2) y GNM
        if: ${{ always() && inputs.probe_sdl }}
        continue-on-error: true
        run: |
          set +e
          out="$GITHUB_WORKSPACE/logs/piglet_probe.txt"
          mkdir -p "$GITHUB_WORKSPACE/logs"; : > "$out"
          tc="${OO_PS4_TOOLCHAIN:-}"
          {
            echo "== samples/piglet (archivos)"
            find "$tc/samples/piglet" -type f 2>/dev/null | head -60
            echo "== Makefile del sample"
            cat "$tc/samples/piglet/Makefile" 2>/dev/null | head -150
            for f in $(find "$tc/samples/piglet" -type f \( -name '*.cpp' -o -name '*.c' -o -name '*.h' -o -name '*.glsl' -o -name '*.txt' -o -name '*.md' \) 2>/dev/null | head -20); do
              echo; echo "######## $f"; head -c 60000 "$f"
            done
            echo; echo "== cabeceras EGL/GLES/Piglet en include y samples"
            find "$tc/include" "$tc/samples" \( -iname '*egl*' -o -iname '*piglet*' -o -iname '*gles*' -o -iname 'GnmDriver.h' \) -type f 2>/dev/null | head -40
            echo "== libs de Piglet/EGL/GLES"
            ls -la "$tc/lib" 2>/dev/null | grep -i -E "piglet|egl|gles|gnm"
            echo "== simbolos exportados de libScePigletv2VSH.so"
            (nm -D --defined-only "$tc/lib/libScePigletv2VSH.so" 2>/dev/null || strings -a "$tc/lib/libScePigletv2VSH.so" | grep -E "^(egl|gl|Piglet|scePiglet)" ) | head -150
            echo "== GnmDriver.h (funciones)"
            grep -n -E "^[a-zA-Z].*\(" "$tc/include/orbis/GnmDriver.h" 2>/dev/null | head -80
            echo "== APIs utiles para descargas/estado (v0.9.6): reposo, notificaciones, espacio libre"
            grep -rn -i -E "PowerTick|SystemService|ReNewLicense|statvfs|statfs|SystemNotification|sceNotification|MsgDialog" "$tc/include" 2>/dev/null | head -40
            ls "$tc/lib" 2>/dev/null | grep -i -E "SystemService|SysUtil|Notification|MsgDialog|Audio|Ngs2|Ajm"
            echo "== estado de SDL: que registra PS4_RenderDriver"
            for f in "$tc"/lib/libSDL2.a; do
              [ -f "$f" ] && (strings -a "$f" | grep -n -i -E "PS4_RenderDriver|PS4_CreateRenderer|SDL_HINT_RENDER_DRIVER|render driver" | head -20)
            done
          } >> "$out" 2>&1
          wc -c "$out"

      # Sonda para el futuro soporte de JavaScript (no cambia el PKG): baja QuickJS-ng, lista sus archivos y API y prueba a
      # compilar cada .c con los mismos flags que usa el Makefile de OpenOrbis. Con logs/quickjs_probe.txt se escribe el enlace real.
      - name: Sonda de JavaScript (QuickJS-ng)
        if: ${{ always() && inputs.probe_js }}
        continue-on-error: true
        run: |
          set +e
          out="$GITHUB_WORKSPACE/logs/quickjs_probe.txt"
          mkdir -p "$GITHUB_WORKSPACE/logs"; : > "$out"
          tag=$(gh api repos/quickjs-ng/quickjs/releases/latest --jq .tag_name 2>>"$out")
          echo "tag: $tag" >> "$out"
          git clone -q --depth 1 --branch "$tag" https://github.com/quickjs-ng/quickjs "$RUNNER_TEMP/qjs" >> "$out" 2>&1
          cd "$RUNNER_TEMP/qjs" || exit 0
          { echo "== archivos"; ls -la; echo "== lineas"; wc -l *.c *.h 2>/dev/null | tail -30
            echo "== API clave"; grep -n -E "JS_NewRuntime|JS_SetInterruptHandler|JS_SetMemoryLimit|JS_SetMaxStackSize|JS_NewContext\b|JS_NewCFunction\b|QJS_VERSION|JS_ExecutePendingJob" quickjs.h | head -30
            echo "== licencia"; head -5 LICENSE; } >> "$out" 2>&1
          echo "== compilar cada .c con los flags de OpenOrbis (objetivo freebsd12)" >> "$out"
          for f in *.c; do
            case "$f" in qjs.c|qjsc.c|run-test262.c|unicode_gen.c|repl.c|quickjs-libc.c|gen_*.c|*test*|*example*|*fuzz*) continue;; esac
            if clang --target=x86_64-pc-freebsd12-elf -fPIC -funwind-tables -c -O2 -w -isysroot "$OO_PS4_TOOLCHAIN" -isystem "$OO_PS4_TOOLCHAIN/include" -I. -o /dev/null "$f" >> "$out.tmp" 2>&1
            then echo "OK   $f" >> "$out"; else echo "FALLA $f" >> "$out"; head -25 "$out.tmp" >> "$out"; fi
            rm -f "$out.tmp"
          done
          cat "$out"

      - name: Subir logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: logs
          if-no-files-found: ignore

      - name: Subir PKG
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: psbrowser-pkg
          path: dist
          if-no-files-found: error
